      // GitHub Pages SPA 404 redirect trick
      // Saves the current URL to sessionStorage then redirects to base
      sessionStorage.redirect = location.href;
      location.replace(
        location.protocol + '//' + location.host + '/personal-website/'
      );
    </script>
